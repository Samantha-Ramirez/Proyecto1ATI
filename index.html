<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <script type="text/javascript" src="datos/index.json" defer></script>
    <script type="module" src="js/index.js" defer></script>
    <title id="title"></title>
</head>
<body>
    <header>
        <nav class="navbar-container">
            <ul class="navbar-content">
                <li id="siteTitle"></li>
                <li><span id="siteGreetings"></span></li>
                <li>
                    <form id="siteSearch">
                       <input id="searchText" type="text" placeholder="" value="">
                       <input id="searchSubmit" type="submit" value=""> 
                    </form>
                </li>
            </ul>
        </nav>
    </header>

    <section id="listView">
        <ul class="cards-container"></ul>
        <p class="site-message"></p>
    </section>

    <section id="profileView" class="hidden">
    </section>

    <template id="profileTemplate">
        <div class="profile-container">
            <div class="profile-img"></div>
            <div class="profile-content">
                <p class="profile-content-name"></p>
                <p class="profile-content-description"></p>
                <div class="profile-content-data">
                    <p id="color" class="data-label"></p><p class="data-value"></p>
                    <p id="book" class="data-label"></p><p class="data-value"></p>
                    <p id="music" class="data-label"></p><p class="data-value"></p>
                    <p id="videogames" class="data-label"></p><p class="data-value"></p>
                    <strong id="langs" class="data-label"></strong><strong class="data-value"></strong>
                </div>
                <p class="profile-content-contact"></p>
            </div>
            <button id="backButton">Regresar</button>
        </div>
    </template>

    <footer id="copyRight"></footer>
</body>
</html>
